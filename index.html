<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* АНИМИРОВАННАЯ РАМКА ПО ПЕРИМЕТРУ */
        .frame-svg {
            position: fixed;
            top: 10px;
            left: 10px;
            width: calc(100vw - 20px);
            height: calc(100vh - 20px);
            pointer-events: none;
            z-index: 10;
        }

        .frame-rect {
            fill: none;
            stroke: url(#frameGradient);
            stroke-width: 3;
            rx: 24;
            filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.6));
        }

        /* ЭКРАН ЗАГРУЗКИ (Preloader) */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-text {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-transform: uppercase;
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.95);
                opacity: 0.5;
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
                text-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
            }
            100% {
                transform: scale(0.95);
                opacity: 0.5;
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            }
        }

        #preloader.preloader-hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* ПОДСВЕТКА ЗА КУРСОРОМ (По умолчанию скрыта для мобилок) */
        .cursor-light {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 40%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            transition: width 0.3s, height 0.3s;
        }

        /* Подсветка отображается ТОЛЬКО на устройствах с мышкой/курсором */
        hover: hover and (pointer: fine) {
            .cursor-light {
                display: block;
            }
        }

        /* ПЛАВНЫЙ ЗВЁЗДНЫЙ ФОН С МЕРЦАНИЕМ */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 200px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 350px 250px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 450px 150px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            animation: moveStars 20s linear infinite, starTwinkle 3s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes moveStars {
            from { transform: translateY(0); }
            to { transform: translateY(-500px); }
        }

        @keyframes starTwinkle {
            0% { opacity: 0.1; }
            50% { opacity: 0.7; }
            100% { opacity: 0.3; }
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            position: relative;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeInDown 0.8s ease forwards;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #777777;
            text-transform: uppercase;
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeInUp 0.8s ease 0.2s forwards;
            opacity: 0;
        }

        .card {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 18px 22px;
            width: 100%;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card svg {
            margin-right: 15px;
            width: 24px;
            height: 24px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        .card:hover {
            background: rgba(30, 30, 30, 0.95);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
        }

        footer {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #555555;
            text-align: center;
            animation: fadeInUp 0.8s ease 0.4s forwards;
            opacity: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="preloader">
        <div class="loader-text">RPS</div>
    </div>

    <!-- SVG-РАМКА -->
    <svg class="frame-svg">
        <defs>
            <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff">
                    <animate attributeName="stop-color" values="#ffffff;#222222;#ffffff" dur="4s" repeatCount="indefinite" />
                </stop>
                <stop offset="50%" stop-color="#111111">
                    <animate attributeName="stop-color" values="#111111;#ffffff;#111111" dur="4s" repeatCount="indefinite" />
                </stop>
                <stop offset="100%" stop-color="#ffffff">
                    <animate attributeName="stop-color" values="#ffffff;#222222;#ffffff" dur="4s" repeatCount="indefinite" />
                </stop>
            </linearGradient>
        </defs>
        <rect class="frame-rect" x="2" y="2" width="100%" height="100%" rx="24"/>
    </svg>

    <!-- Подсветка за курсором -->
    <div class="cursor-light" id="cursorLight"></div>

    <!-- Звёздный фон -->
    <div class="stars"></div>

    <div class="container">
        <header>
            <h1 class="logo">RPS</h1>
            <div class="subtitle">Official Links</div>
        </header>

        <div class="links">
            <a href="https://t.me/RPStgk" target="_blank" class="card">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.228-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141.119.098.152.228.163.331.011.103.024.336.008.518z"/></svg>
                Telegram
            </a>
            
            <a href="https://www.donationalerts.com/r/rps111" target="_blank" class="card">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                DonationAlerts
            </a>
        </div>

        <footer>
            <p>© 2026 RPS</p>
        </footer>
    </div>

    <script>
        // Скрытие экрана загрузки
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.classList.add('preloader-hidden');
            }, 600);
        });

        // Подсветка за курсором
        const cursorLight = document.getElementById('cursorLight');
        window.addEventListener('mousemove', (e) => {
            cursorLight.style.left = `${e.clientX}px`;
            cursorLight.style.top = `${e.clientY}px`;
        });
    </script>
</body>
</html>
